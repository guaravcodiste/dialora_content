<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Lato'; src: url('file:///home/user/dialora_content/Lato-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'Lato'; src: url('file:///home/user/dialora_content/Lato-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; }
  @font-face { font-family: 'Lato'; src: url('file:///home/user/dialora_content/Lato-Black.ttf') format('truetype'); font-weight: 900; font-style: normal; }
  @font-face { font-family: 'Lato'; src: url('file:///home/user/dialora_content/Lato-Italic.ttf') format('truetype'); font-weight: 400; font-style: italic; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 980px; height: 1200px; overflow: hidden; background: #050B1A; font-family: 'Lato', sans-serif; position: relative; }
  .dot-pattern { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(74,144,217,0.35) 1.2px, transparent 1.2px); background-size: 14px 14px; z-index: 1; }
  .card { position: absolute; top: 40px; left: 40px; right: 40px; bottom: 40px; border-radius: 32px; background: radial-gradient(ellipse at 50% 35%, rgba(33,109,200,0.55) 0%, rgba(15,40,80,0.7) 35%, rgba(8,20,40,0.85) 70%, rgba(5,11,26,0.95) 100%); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 0 80px rgba(25,118,210,0.2) inset; overflow: hidden; z-index: 2; }
  .card::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 80%; height: 60%; background: radial-gradient(ellipse at center top, rgba(66,165,245,0.3) 0%, transparent 70%); pointer-events: none; }
  .card::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(150,200,255,0.06) 1px, transparent 1px); background-size: 12px 12px; pointer-events: none; }
  .logo-top { position: absolute; top: 60px; left: 70px; z-index: 11; width: 180px; height: auto; }
  .content { position: relative; z-index: 10; padding: 60px 70px; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
  h1 { font-size: 72px; font-weight: 900; line-height: 1.05; color: #ffffff; letter-spacing: -1.5px; margin-bottom: 16px; }
  h1 .blue { color: #42A5F5; }
  .pre-line { font-size: 28px; color: rgba(255,255,255,0.65); font-weight: 400; margin-bottom: 38px; }
  ul.bullets { list-style: none; }
  ul.bullets li { font-size: 32px; color: #ffffff; margin-bottom: 26px; font-weight: 700; display: flex; align-items: baseline; gap: 18px; }
  ul.bullets li::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #42A5F5; flex-shrink: 0; transform: translateY(-6px); }
  .website { position: absolute; bottom: 50px; right: 70px; z-index: 11; font-size: 22px; color: rgba(255,255,255,0.6); font-weight: 400; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="dot-pattern"></div>
<div class="card">
  <img src="file:///home/user/dialora_content/dialora-logo.png" class="logo-top" alt="Dialora">
  <div class="content">
    <h1>Calls Cognigy<br>routes to <span class="blue">agents.</span><br>Every time.</h1>
    <div class="pre-line">The coverage gap no NLU platform fills:</div>
    <ul class="bullets">
      <li>After-hours inbound calls</li>
      <li>Outbound follow-up sequences</li>
      <li>Live call lead qualification</li>
      <li>Appointment booking on live calls</li>
    </ul>
  </div>
  <div class="website">dialora.ai</div>
</div>
</body>
</html>
